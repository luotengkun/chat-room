<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双人聊天室</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); height: 100vh; display: flex; justify-content: center; align-items: center; }

#login-screen {
  background: rgba(255,255,255,0.05); backdrop-filter: blur(20px);
  border-radius: 20px; padding: 40px; width: 380px; text-align: center;
  box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1);
}
#login-screen h1 { color: #fff; font-size: 24px; margin-bottom: 8px; }
#login-screen p { color: rgba(255,255,255,0.6); font-size: 14px; margin-bottom: 24px; }
#login-screen input {
  width: 100%; padding: 14px 16px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.08); color: #fff; font-size: 15px; outline: none; margin-bottom: 16px;
  transition: border-color 0.3s;
}
#login-screen input::placeholder { color: rgba(255,255,255,0.35); }
#login-screen input:focus { border-color: #6c63ff; }
.btn-primary {
  width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #6c63ff, #3f8efc);
  color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s;
  margin-bottom: 12px;
}
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,99,255,0.4); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.btn-secondary {
  width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
  background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7); font-size: 14px;
  cursor: pointer; transition: all 0.2s; margin-bottom: 16px;
}
.btn-secondary:hover { background: rgba(255,255,255,0.1); color: #fff; }
.room-info {
  margin-top: 12px; padding: 12px; background: rgba(255,255,255,0.05); border-radius: 10px;
  display: none; align-items: center; gap: 8px; justify-content: center;
}
.room-info.show { display: flex; }
.room-info span { color: rgba(255,255,255,0.5); font-size: 13px; }
.room-info code { color: #6c63ff; font-size: 16px; font-weight: 700; background: rgba(108,99,255,0.15); padding: 4px 12px; border-radius: 8px; letter-spacing: 2px; }
.copy-btn {
  background: none; border: none; color: #6c63ff; cursor: pointer; font-size: 13px; text-decoration: underline;
}
#login-status { color: rgba(255,255,255,0.5); font-size: 13px; min-height: 20px; margin-top: 8px; }

/* 聊天界面 */
#chat-screen {
  display: none; width: 100%; max-width: 700px; height: 100vh; max-height: 100vh;
  background: #1a1a2e; flex-direction: column;
}
#chat-header {
  padding: 16px 20px; background: rgba(255,255,255,0.03); border-bottom: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; justify-content: space-between;
}
#chat-header h2 { color: #fff; font-size: 16px; }
#chat-header .status { font-size: 12px; margin-top: 2px; }
#chat-header .status.online { color: #4ade80; }
#chat-header .status.offline { color: rgba(255,255,255,0.3); }
.user-count {
  background: rgba(108,99,255,0.2); color: #a5a0ff; padding: 4px 12px; border-radius: 20px; font-size: 12px;
}

#messages {
  flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px;
  scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.1) transparent;
}
#messages::-webkit-scrollbar { width: 6px; }
#messages::-webkit-scrollbar-track { background: transparent; }
#messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }

.msg { max-width: 75%; animation: fadeIn 0.3s ease; }
.msg.mine { align-self: flex-end; }
.msg.other { align-self: flex-start; }
.msg .bubble {
  padding: 10px 16px; border-radius: 18px; font-size: 14px; line-height: 1.6; word-break: break-word;
}
.msg.mine .bubble { background: linear-gradient(135deg, #6c63ff, #3f8efc); color: #fff; border-bottom-right-radius: 6px; }
.msg.other .bubble { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.9); border-bottom-left-radius: 6px; }
.msg .name { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 4px; padding-left: 4px; }
.msg .time { font-size: 11px; color: rgba(255,255,255,0.25); margin-top: 4px; text-align: right; padding-right: 4px; }
.msg.other .time { text-align: left; padding-left: 4px; }
.system-msg {
  align-self: center; font-size: 12px; color: rgba(255,255,255,0.3);
  padding: 4px 14px; background: rgba(255,255,255,0.03); border-radius: 10px;
}

#input-area {
  padding: 16px 20px; background: rgba(255,255,255,0.03); border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; gap: 10px; align-items: flex-end;
}
#msg-input {
  flex: 1; padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.1);
  background: rgba(255,255,255,0.06); color: #fff; font-size: 14px; outline: none; resize: none;
  max-height: 120px; line-height: 1.5; font-family: inherit;
}
#msg-input::placeholder { color: rgba(255,255,255,0.25); }
#msg-input:focus { border-color: #6c63ff; }
#send-btn {
  width: 44px; height: 44px; border-radius: 14px; border: none;
  background: linear-gradient(135deg, #6c63ff, #3f8efc); color: #fff;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: transform 0.2s; flex-shrink: 0;
}
#send-btn:hover { transform: scale(1.05); }
#send-btn svg { width: 20px; height: 20px; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div id="login-screen">
  <h1>双人聊天室</h1>
  <p>创建房间或加入房间，与好友实时聊天</p>
  <input type="text" id="nickname" placeholder="输入你的昵称" maxlength="12" autofocus>
  <button class="btn-primary" onclick="createRoom()">创建新房间</button>
  <button class="btn-secondary" onclick="toggleJoin()">加入已有房间</button>
  <div id="join-fields" style="display:none">
    <input type="text" id="room-id" placeholder="输入房间号" maxlength="20" style="text-transform:uppercase">
    <button class="btn-primary" onclick="joinRoom()">加入房间</button>
  </div>
  <div class="room-info" id="room-info">
    <span>房间号：</span>
    <code id="display-room"></code>
    <button class="copy-btn" onclick="copyRoom()">复制</button>
  </div>
  <div id="login-status"></div>
</div>

<div id="chat-screen">
  <div id="chat-header">
    <div>
      <h2>聊天室</h2>
      <span class="status" id="status-text">等待对方加入...</span>
    </div>
    <span class="user-count" id="user-count">1 人在线</span>
  </div>
  <div id="messages"></div>
  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="输入消息，Enter 发送..." onkeydown="handleKey(event)"></textarea>
    <button id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
    </button>
  </div>
</div>

<script>
let peer = null;
let conn = null;
let myName = '';
let roomId = '';
let isHost = false;
const messagesEl = document.getElementById('messages');

function genRoomId() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let id = '';
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

function setStatus(text) {
  document.getElementById('login-status').textContent = text;
}

function toggleJoin() {
  const el = document.getElementById('join-fields');
  el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

// ========== 创建房间（作为Host） ==========
function createRoom() {
  myName = document.getElementById('nickname').value.trim();
  if (!myName) { document.getElementById('nickname').focus(); return; }

  roomId = genRoomId();
  isHost = true;
  setStatus('正在创建房间...');

  // 用随机Peer ID，不跟房间号绑定，避免冲突
  peer = new Peer('chatroom-' + roomId + '-host', {
    host: '0.peerjs.com', port: 443, secure: true, debug: 0
  });

  peer.on('open', function() {
    setStatus('房间已创建，等待好友加入...');
    document.getElementById('display-room').textContent = roomId;
    document.getElementById('room-info').classList.add('show');
    switchToChat();
    addSystemMsg('房间 ' + roomId + ' 已创建，将房间号发给好友即可开始聊天');

    // 监听加入
    peer.on('connection', function(connection) {
      conn = connection;
      setupConn();
    });
  });

  peer.on('error', function(err) {
    if (err.type === 'unavailable-id') {
      // 房间号重复（极低概率），换一个
      roomId = genRoomId();
      peer.destroy();
      createRoom();
    } else {
      setStatus('创建失败: ' + err.type + '，请重试');
    }
  });
}

// ========== 加入房间（作为Guest） ==========
function joinRoom() {
  myName = document.getElementById('nickname').value.trim();
  if (!myName) { document.getElementById('nickname').focus(); return; }

  roomId = document.getElementById('room-id').value.trim().toUpperCase();
  if (!roomId) { document.getElementById('room-id').focus(); return; }

  isHost = false;
  setStatus('正在连接房间...');

  // Guest 用自己的随机Peer ID
  peer = new Peer(undefined, {
    host: '0.peerjs.com', port: 443, secure: true, debug: 0
  });

  peer.on('open', function() {
    // 连接到Host
    conn = peer.connect('chatroom-' + roomId + '-host', { reliable: true });
    setupConn();

    // 连接超时处理
    setTimeout(function() {
      if (!conn || !conn.open) {
        setStatus('连接失败，请检查房间号是否正确');
        if (peer) peer.destroy();
      }
    }, 10000);
  });

  peer.on('error', function(err) {
    if (err.type === 'peer-unavailable') {
      setStatus('房间不存在或已关闭，请检查房间号');
    } else {
      setStatus('连接失败: ' + err.type);
    }
  });
}

// ========== 通用连接处理 ==========
function setupConn() {
  conn.on('open', function() {
    conn.send({ type: 'join', name: myName, isHost: isHost });
    updateOnline(2);
    addSystemMsg('已连接！可以开始聊天了');
    setStatus('');
  });

  conn.on('data', function(data) {
    if (data.type === 'join') {
      addSystemMsg(data.name + ' 加入了聊天');
      updateOnline(2);
    } else if (data.type === 'msg') {
      addMessage(data.name, data.text, data.time, false);
    } else if (data.type === 'leave') {
      addSystemMsg(data.name + ' 离开了聊天');
      updateOnline(1);
    }
  });

  conn.on('close', function() {
    addSystemMsg('对方已断开连接');
    updateOnline(1);
    conn = null;
  });
}

function switchToChat() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('chat-screen').style.display = 'flex';
}

function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !conn || !conn.open) return;

  const time = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  conn.send({ type: 'msg', name: myName, text: text, time: time });
  addMessage(myName, text, time, true);
  input.value = '';
  input.style.height = 'auto';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

function addMessage(name, text, time, isMine) {
  const div = document.createElement('div');
  div.className = 'msg ' + (isMine ? 'mine' : 'other');
  div.innerHTML =
    (!isMine ? '<div class="name">' + esc(name) + '</div>' : '') +
    '<div class="bubble">' + esc(text).replace(/\n/g, '<br>') + '</div>' +
    '<div class="time">' + time + '</div>';
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addSystemMsg(text) {
  const div = document.createElement('div');
  div.className = 'system-msg';
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function updateOnline(n) {
  document.getElementById('user-count').textContent = n + ' 人在线';
  const s = document.getElementById('status-text');
  if (n >= 2) { s.textContent = '已连接'; s.className = 'status online'; }
  else { s.textContent = '等待对方加入...'; s.className = 'status offline'; }
}

function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function copyRoom() {
  navigator.clipboard.writeText(roomId).then(function() {
    const btn = document.querySelector('.copy-btn');
    btn.textContent = '已复制!';
    setTimeout(function() { btn.textContent = '复制'; }, 1500);
  });
}

document.getElementById('msg-input').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

document.getElementById('nickname').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') document.getElementById('room-id').focus();
});

window.addEventListener('beforeunload', function() {
  if (conn && conn.open) {
    try { conn.send({ type: 'leave', name: myName }); } catch(e) {}
  }
  if (peer) peer.destroy();
});
</script>
</body>
</html>
